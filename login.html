{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login-wrap">
  <form method="post" class="card login-card">
    <div class="login-brand"><span class="brand-mark">+</span> MediAnalytics</div>
    <p class="muted">Hospital Patient Data Analyzer &amp; Visualization System</p>

    <label for="username">Username</label>
    <input id="username" name="username" required autofocus autocomplete="username">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">

    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
</div>
{% endblock %}
