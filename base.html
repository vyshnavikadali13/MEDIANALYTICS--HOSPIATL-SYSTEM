<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · MediAnalytics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% if g.user %}
  <header class="navbar">
    <a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">+</span> MediAnalytics</a>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('patients.list_patients') }}" class="{{ 'active' if request.endpoint in ('patients.list_patients', 'patients.detail', 'patients.edit') }}">Patients</a>
      <a href="{{ url_for('patients.add') }}" class="{{ 'active' if request.endpoint == 'patients.add' }}">Add Patient</a>
    </nav>
    <div class="user">
      <span>{{ g.user.username }}</span>
      <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>
  </header>
  {% endif %}

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
